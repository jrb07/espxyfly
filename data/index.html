<!DOCTYPE html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <style>
    .dropdown 
    {
      float: left;
      overflow: hidden;
      position: absolute;
    }
    .dropdown .dropbtn 
    {
      font-size: 16px;
      border: none;
      outline: none;
      color: white;
      padding: 10px 10px;
      background-color: inherit;
      font: inherit;
      margin: 0; 
    }
    .dropdown-content 
    {
      float: left;
      padding: 20px;
      height: 50px;
      display: grid;
      position: absolute;
      background-color: #f9f9f9;
      width: 100%;
      left: 0;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
      font: inherit;
      margin: 0;
    }
    .row 
    {
      float: left;
      width: 100%;
      padding: 10px;
      background-color: #ccc;
      height: 150px;
      font: inherit;
      margin: 0;
    }
    .column 
    {
      float: left;
      width: 30px;
      padding: 20px;
      background-color: #ccc;
      height: 100px;
      font: inherit;
      margin: 0;
    }
    .buttoncontainer
    {
      float: left;
      padding: 20px;
      background-color: rgb(235, 235, 235);
      height: 50px;
      -webkit-appearance: none;
      appearance: none;
      width: 33%;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin: 0;
    }
    .feedcontainer
    {
      float: middle;
      padding: 20px;
      font: inherit;
      margin: 0;
      position: absolute;
    }
    .textcontainer:hover
    {
      text-emphasis-color: red;
    }
    .statuscontainer
    {
      width: 100%;
    }
    .button
    {
      float: left;
      width: 30px;
      padding: 20px;
      background-color: #ccc;
      height: 100px;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin: 0;
      position: absolute;
    }
    .button:hover
    {
      opacity: 1;
    }
    .highlighter 
    {
      background: rgba(0, 255, 0, 0.25);
      border: 1px dashed #fff;
      z-index: 1;
      position: absolute;
    }
    .container
    {
      position: relative;
      border: 10px solid black;
      height: 100%;
      width: 50%;
    }
    .rangecontainer
    {
      float: left;
      padding: 20px;
      background-color: rgb(235, 235, 235);
      height: 50px;
      -webkit-appearance: none;
      appearance: none;
      width: 33%;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin: 0;
    }
    .canvas 
    {
      float: left;
      padding: 0px;
      background-color: rgb(235, 235, 235);
      -webkit-appearance: none;
      appearance: none;
      opacity: 0.8;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin-top: 0px;
      border: 0px solid black;
    }   
    .sliderX
    {
      float: right;
      padding: 0px;
      background-color: rgb(235, 235, 235);
      -webkit-appearance: none;
      appearance: none;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin-top: 0px;
      margin-right: -15px;
      rotate: 0deg;
      width: 100px;
    }
    .sliderY
    {
      float: left;
      padding: 0px;
      background-color: rgb(235, 235, 235);
      -webkit-appearance: none;
      appearance: none;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin-left: -40px;
      margin-top: 60px;
      rotate: 90deg;
      width: 100px;
    }
    .grid-container-xy 
    {
      display: grid;
      grid-template-columns: 20px 85px;
      grid-template-rows: 150px;
    }
    .grid-container 
    {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: auto auto;
    }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>XYFLY</h1>

      <h2>Auto Mating Flies</h2>

      <div class="statuscontainer">
        <p>Status: <span class="textcontainer" id="main_status"></span></p>
      </div>

      <div class="buttoncontainer">
        <input type="button" value="Configure WiFi" id="config_button">
      </div>

      <div class="buttoncontainer">
        <input type="button" value="Go home" id="go_home_button">
        <input type="button" value="Set home" id="set_home_button">
      </div>

      <div class="buttoncontainer">
        <input type="button" value="Run main" id="run_main_button">
        <input type="button" value="Stop main" id="stop_main_button">
      </div>

      <div class="buttoncontainer">
        <input type="button" value="X -" id="jog_left_button">
        <input type="button" value="X +" id="jog_right_button">
        <input type="button" value="Stop X" id="stopX_button">
      </div>

      <div class="buttoncontainer">
        <input type="button" value="Y +" id="jog_up_button">
        <input type="button" value="Y -" id="jog_down_button">
        <input type="button" value="Stop Y" id="stopY_button">
      </div>

      <div class="buttoncontainer">
        <input type="button" value="Dispense" id="dispense_button">
      </div>

      <div class="buttoncontainer">
        <input type="button" value="Stop ALL" id="stop_button">
      </div>

      <div class="grid-container-xy">
        <div>
          <input type="range" min="0" max="100" value="0" class="sliderY" id="sliderY">
        </div>
        <div>

          <input type="range" min="0" max="100" value="0" class="sliderX" id="sliderX">
          <canvas id="canvas_element" width="100" height="100" class="canvas"></canvas>
        </div>
        <div></div>
        <div>
          <input type="button" value="Go to target" id="goto_target_button">
        </div>
        <div></div>
        <div>
          <p>Target (x, y): <span class="textcontainer" id="rect_pos_text"></span></p>
        </div>
      </div>
      <div class="buttoncontainer">
        <div class="grid-container">
          <input type="button" value="Microstep: 1" id="microstep1_button">    
          <input type="button" value="Microstep: 2" id="microstep2_button">    
          <input type="button" value="Microstep: 4" id="microstep4_button">
          <input type="button" value="Microstep: 8" id="microstep8_button">
          <input type="button" value="Microstep: 16" id="microstep16_button">
          <input type="button" value="Microstep: 32" id="microstep32_button">
          <input type="range" min="0" max="4000" value="4000" class="slider" id="sliderSpeed">
          <input type="button" value="Set speed" id="speed_button">
          <p>Speed (steps per second): <span class="textcontainer" id="target_speed_text">4000</span></p>
        </div>
      </div>
    </div>


  <script>
  var xhr = new XMLHttpRequest();
  var main_button = document.getElementById("run_main_button");
  var stop_main_button = document.getElementById("stop_main_button");
  var stop_button = document.getElementById("stop_button");
  var go_home_button = document.getElementById("go_home_button");
  var set_home_button = document.getElementById("set_home_button");
  var main_status = document.getElementById("main_status");
  var config_button = document.getElementById("config_button");
  var jog_left_button = document.getElementById("jog_left_button");
  var jog_right_button = document.getElementById("jog_right_button");
  var jog_up_button = document.getElementById("jog_up_button");
  var jog_down_button = document.getElementById("jog_down_button");
  var dispense_button = document.getElementById("dispense_button");
  var stopX_button = document.getElementById("stopX_button");
  var stopY_button = document.getElementById("stopY_button");
  var full_button = document.getElementById('full_vial_button');
  var empty_button = document.getElementById('empty_vial_button');
  var canvas_element = document.getElementById('canvas_element');
  var microstep1_button = document.getElementById('microstep1_button');
  var microstep2_button = document.getElementById('microstep2_button');
  var microstep4_button = document.getElementById('microstep4_button');
  var microstep8_button = document.getElementById('microstep8_button');
  var microstep16_button = document.getElementById('microstep16_button');
  var microstep32_button = document.getElementById('microstep32_button');
  var sliderSpeed = document.getElementById('sliderSpeed');
  var speed_button = document.getElementById('speed_button');
  var target_speed_text = document.getElementById('target_speed_text');
  var canvas = document.createElement('canvas');
  var live_view = document.getElementById('live_view');
  var ctx = canvas_element.getContext("2d");
  var targetX = 0;
  var targetY = 0;
  var rect_pos_text = document.getElementById('rect_pos_text');
  var sliderX = document.getElementById('sliderX');
  var sliderY = document.getElementById('sliderY');
  var targetSize = 10;
  var command = "";

  //Update the canvas when the mouse is hovered over to render the red rectangle over the mouse position
  canvas_element.onmousemove = function(evt){updateCanvas(evt);}
  //Get the mouse position relative to the canvas
  function getMousePos(evt) 
  {
      var rect = canvas_element.getBoundingClientRect();
      return {x: evt.clientX - rect.left, y: evt.clientY - rect.top};
  }
  //Erase all canvas elements and draw all the elements to the canvas
  function updateCanvas(evt)
  {
    //Clear the canvas then 
    //  Draw the green target rectangle
    ctx.clearRect(0, 0, canvas_element.getAttribute("width"), canvas_element.getAttribute("height"));
    //Draw the red rectangle under the cursor
    var mousePos = getMousePos(evt);
    ctx.fillStyle = "green";
    ctx.fillRect (targetX-2, targetY-2, targetSize, targetSize);
    //Update the text under the canvas with the current target positions
    rect_pos_text.innerHTML = targetY + ", " + targetX;
  }
  //Update the targetX and targetY variables with the position of the mouse cursor on click
  canvas_element.onclick = function(evt) 
  {
    var mousePos = getMousePos(evt);
    targetX = Math.round(mousePos.x);
    targetY = Math.round(mousePos.y);
    sliderX.value = targetX;
    sliderY.value = targetY;
    updateCanvas(evt);
  }
  //Update the position of the target based on the slider values
  sliderX.oninput = function(evt)
  {
    targetX = sliderX.value;
    updateCanvas(evt);
  }
  sliderY.oninput = function(evt)
  {
    //Invert the y values since the slider is rotated 180 degrees
    targetY = sliderY.value;
    updateCanvas(evt);
  }
  sliderSpeed.oninput = function(evt)
  {
    target_speed_text.innerHTML = sliderSpeed.value;
  }
  //The buttons below send a specific command to the ESP32 using the xhr.open() and xhr.send() functions
  speed_button.onclick = function()
  {
    command = "speed" + sliderSpeed.value;
    main_status.innerHTML = "Sending command: " + command;
    xhr.open("GET", "/command?state="+ command, true);
    xhr.send();
  }
  goto_target_button.onclick = function()
  {
    command = "goX" + targetY + "goY" + targetX;
    main_status.innerHTML = "Sending command: " + command;
    xhr.open("GET", "/command?state="+ command, true);
    xhr.send();
  }
  config_button.onclick = function()
  {
    xhr.open("GET", "/config?", true);
    xhr.send();
    location.replace("/config");
  }
  full_button.onclick = function()
  {
    main_status.innerHTML = "Capturing full vial reference";
    xhr.open("GET", "/command?state=fullvial", true);
    xhr.send();
  }
  empty_button.onclick = function()
  {
    main_status.innerHTML = "Capturing empty vial reference";
    xhr.open("GET", "/command?state=emptyvial", true);
    xhr.send();
  }
  main_button.onclick = function()
  {
    main_status.innerHTML = "Fill all vials";
    xhr.open("GET", "/command?state=fillall", true);
    xhr.send();
  }
  stop_main_button.onclick = function()
  {
    main_status.innerHTML = "Stop all filling operations";
    xhr.open("GET", "/command?state=stopfillall", true);
    xhr.send();
  }
  jog_left_button.onclick = function()
  {
    main_status.innerHTML = "Jog left (-X)";
    xhr.open("GET", "/command?state=left", true);
    xhr.send();
  }
  jog_right_button.onclick = function()
  {
    main_status.innerHTML = "Jog right (+X)";
    xhr.open("GET", "/command?state=right", true);
    xhr.send();
  }
  stopX_button.onclick = function()
  {
    main_status.innerHTML = "Stopping X stepper";
    xhr.open("GET", "/command?state=stopX", true);
    xhr.send();
  }
  jog_up_button.onclick = function()
  {
    main_status.innerHTML = "Jog up (+Y)";
    xhr.open("GET", "/command?state=up", true);
    xhr.send();
  }
  jog_down_button.onclick = function()
  {
    main_status.innerHTML = "Jog down (-Y)";
    xhr.open("GET", "/command?state=down", true);
    xhr.send();
  }
  stopY_button.onclick = function()
  {
    main_status.innerHTML = "Stopping Y stepper";
    xhr.open("GET", "/command?state=stopY", true);
    xhr.send();
  }
  stop_button.onclick = function()
  {
    main_status.innerHTML = "Stopping the steppers";
    xhr.open("GET", "/command?state=stop", true);
    xhr.send();
  }
  go_home_button.onclick = function()
  {
    main_status.innerHTML = "Homing the steppers";
    xhr.open("GET", "/command?state=gohome", true);
    xhr.send();
  }
  set_home_button.onclick = function()
  {
    main_status.innerHTML = "Setting home for both steppers";
    xhr.open("GET", "/command?state=sethome", true);
    xhr.send();
  }
  dispense_button.onclick = function()
  {
    main_status.innerHTML = "Dispensing";
    xhr.open("GET", "/command?state=dispense", true);
    xhr.send();
  }
  microstep1_button.onclick = function()
  {
    main_status.innerHTML = "Microstep set to: 1";
    xhr.open("GET", "/command?state=microstep1", true);
    xhr.send();
  }
  microstep2_button.onclick = function()
  {
    main_status.innerHTML = "Microstep set to: 2";
    xhr.open("GET", "/command?state=microstep2", true);
    xhr.send();
  }
  microstep4_button.onclick = function()
  {
    main_status.innerHTML = "Microstep set to: 4";
    xhr.open("GET", "/command?state=microstep4", true);
    xhr.send();
  }
  microstep8_button.onclick = function()
  {
    main_status.innerHTML = "Microstep set to: 8";
    xhr.open("GET", "/command?state=microstep8", true);
    xhr.send();
  }
  microstep16_button.onclick = function()
  {
    main_status.innerHTML = "Microstep set to: 16";
    xhr.open("GET", "/command?state=microstep16", true);
    xhr.send();
  }
  microstep32_button.onclick = function()
  {
    main_status.innerHTML = "Microstep set to: 32";
    xhr.open("GET", "/command?state=microstep32", true);
    xhr.send();
  }
  </script>
  </body>
</html>
