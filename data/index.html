<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8" />

<style>
.dropdown 
{
  float: left;
  overflow: hidden;
}
.dropdown .dropbtn 
{
  font-size: 16px;
  border: none;
  outline: none;
  color: white;
  padding: 10px 10px;
  background-color: inherit;
  font: inherit;
  margin: 0; 
}
.dropdown-content 
{
  float: left;
  padding: 20px;
  height: 50px;
  display: grid;
  position: absolute;
  background-color: #f9f9f9;
  width: 100%;
  left: 0;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
  font: inherit;
  margin: 0;
}
.row 
{
  float: left;
  width: 100%;
  padding: 10px;
  background-color: #ccc;
  height: 150px;
  font: inherit;
  margin: 0;
}
.column 
{
  float: left;
  width: 30px;
  padding: 20px;
  background-color: #ccc;
  height: 100px;
  font: inherit;
  margin: 0;
}
.buttoncontainer
{
  float: left;
  padding: 20px;
  background-color: rgb(235, 235, 235);
  height: 50px;
  -webkit-appearance: none;
  width: 33%;
  height: 25px;
  opacity: 0.7;
  -webkit-transition: .2s;
  transition: opacity .2s;
  font: inherit;
  margin: 0;
}
.feedcontainer
{
  float: middle;
  padding: 20px;
  font: inherit;
  margin: 0;
}
.textcontainer:hover
{
  text-emphasis-color: red;
}
.statuscontainer
{
  width: 100%;
}
.button
{
  float: left;
  width: 30px;
  padding: 20px;
  background-color: #ccc;
  height: 100px;
  -webkit-appearance: none;
  width: 100%;
  height: 25px;
  opacity: 0.7;
  -webkit-transition: .2s;
  transition: opacity .2s;
  font: inherit;
  margin: 0;
}
.button:hover
{
  opacity: 1;
}
.highlighter 
{
  background: rgba(0, 255, 0, 0.25);
  border: 1px dashed #fff;
  z-index: 1;
  position: absolute;
}
</style>
</head>
<body>

<h1>XYFLY</h1>

<h2>Auto Mating Flies</h2>

<div class="statuscontainer">
  <p>Status: <span class="textcontainer" id="main_status"></span></p>
</div>

<div class="buttoncontainer">
  <input type="button" value="Configure WiFi" id="config_button">
</div>

<div class="buttoncontainer">
  <input type="button" value="Go home" id="go_home_button">
  <input type="button" value="Set home" id="set_home_button">
</div>

<div class="buttoncontainer">
  <input type="button" value="Run main" id="run_main_button">
  <input type="button" value="Stop main" id="stop_main_button">
</div>

<div class="buttoncontainer">
  <input type="button" value="X -" id="jog_left_button">
  <input type="button" value="X +" id="jog_right_button">
  <input type="button" value="Stop X" id="stopX_button">
</div>

<div class="buttoncontainer">
  <input type="button" value="Y +" id="jog_up_button">
  <input type="button" value="Y -" id="jog_down_button">
  <input type="button" value="Stop Y" id="stopY_button">
</div>

<div class="buttoncontainer">
  <input type="button" value="Dispense" id="dispense_button">
</div>

<div class="buttoncontainer">
  <input type="button" value="Stop ALL" id="stop_button">
</div>

<div class="buttoncontainer">
  <input type="button" value="Capture full vial reference"  id="full_vial_button" >
</div>

<div class="buttoncontainer">
  <input type="button" value="Capture empty vial reference" id="empty_vial_button">
</div>
