<!DOCTYPE html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <style>
    .buttoncontainer
    {
      float: left;
      padding: 20px;
      background-color: rgb(235, 235, 235);
      height: 50px;
      -webkit-appearance: none;
      appearance: none;
      width: 33%;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin: 0;
    }
    .textcontainer:hover
    {
      text-emphasis-color: red;
    }
    .statuscontainer
    {
      width: 100%;
    }
    .button
    {
      float: left;
      width: 30px;
      padding: 20px;
      background-color: #ccc;
      height: 100px;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin: 0;
      position: absolute;
    }
    .button:hover
    {
      opacity: 1;
    }
    .highlighter 
    {
      background: rgba(0, 255, 0, 0.25);
      border: 1px dashed #fff;
      z-index: 1;
      position: absolute;
    }
    .container
    {
      position: relative;
      height: 100%;
      width: 100%;
    }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="container">
        <h1>XYFLY</h1>
        <h2>Child/Peripheral Device</h2>
        <input type="button" value="Configure WiFi" id="config_button">
        <div class="statuscontainer">
          <p>Status: <span class="textcontainer" id="main_status"></span></p>
        </div>
      </div>
      <p id="debug_parent" style="visibility: hidden;">Debug: <span class="textcontainer" id="debug_text">???</span></p>
    </div>
    
    <script>
    var xhr = new XMLHttpRequest();
    var config_button = document.getElementById("config_button");
 
    config_button.onclick = function()
    {
      xhr.open("GET", "/config?", true);
      xhr.send();
      location.replace("/config");
    }
    </script>
  </body>
</html>
