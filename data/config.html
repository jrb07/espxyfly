<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.buttoncontainer
{
  width: 100%;
}

.button
{
  -webkit-appearance: none;
  width: 100%;
  height: 25px;
  opacity: 0.7;
  -webkit-transition: .2s;
  transition: opacity .2s;
}

.button:hover
{
  opacity: 1;
}
</style>
</head>
<body>
<h1>XYFLY</h1>
<h2>Auto Mating Flies</h2>
<h3>WiFi Configuration</h3>
<div class="buttoncontainer">
  <input type="button" value="Home" id="go_home_button">
</div>
<div class="buttoncontainer">
  <p>    Set SSID:<input type="text" id="set_ssid_input" name="set_ssid_input"><span id="set_ssid_status"></span></p>
</div>
<div class="buttoncontainer">
  <p>Set password:<input type="password" id="set_pass_input" name="set_pass_input"><span id="set_pass_status"></span></p>
</div>
<div class="buttoncontainer">
  <input type="button" value="Ok" id="set_pass_button">
</div>
<script>
var xhr = new XMLHttpRequest();
var set_ssid_input = document.getElementById("set_ssid_input");
var set_pass_button = document.getElementById("set_pass_button");
var set_pass_input = document.getElementById("set_pass_input");
var go_home_button = document.getElementById("go_home_button");
set_pass_button.onclick = function()
{
  xhr.open("GET", "/command?state="+ "ssid."+set_ssid_input.value+".pass."+set_pass_input.value, true);
  xhr.send();
}
go_home_button.onclick = function()
{
  xhr.open("GET", "/", true);
  xhr.send();
  location.replace("/");
}
</script>
</body>
</html>
