<!DOCTYPE html>
<html>
<head>
    <title>XYFLYBLE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <link rel="icon" type="image/png" href="">
    <style>
        .dropdown 
    {
      float: left;
      overflow: hidden;
      position: absolute;
    }
    .dropdown .dropbtn 
    {
      font-size: 16px;
      border: none;
      outline: none;
      color: white;
      padding: 10px 10px;
      background-color: inherit;
      font: inherit;
      margin: 0; 
    }
    .dropdown-content 
    {
      float: left;
      padding: 20px;
      height: 50px;
      display: grid;
      position: absolute;
      background-color: #f9f9f9;
      width: 100%;
      left: 0;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
      font: inherit;
      margin: 0;
    }
    .row 
    {
      float: left;
      width: 100%;
      padding: 10px;
      background-color: #ccc;
      height: 150px;
      font: inherit;
      margin: 0;
    }
    .column 
    {
      float: left;
      width: 30px;
      padding: 20px;
      background-color: #ccc;
      height: 100px;
      font: inherit;
      margin: 0;
    }
    .buttoncontainer
    {
      float: left;
      padding: 20px;
      background-color: rgb(235, 235, 235);
      height: 50px;
      -webkit-appearance: none;
      appearance: none;
      width: 33%;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin: 0;
    }
    .feedcontainer
    {
      float: middle;
      padding: 20px;
      font: inherit;
      margin: 0;
      position: absolute;
    }
    .textcontainer:hover
    {
      text-emphasis-color: red;
    }
    .statuscontainer
    {
      width: 100%;
    }
    .button
    {
      float: left;
      width: 30px;
      padding: 20px;
      background-color: #ccc;
      height: 100px;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin: 0;
      position: absolute;
    }
    .button:hover
    {
      opacity: 1;
    }
    .highlighter 
    {
      background: rgba(0, 255, 0, 0.25);
      border: 1px dashed #fff;
      z-index: 1;
      position: absolute;
    }
    .container
    {
      position: relative;
      height: 100%;
      width: 100%;
    }
    .rangecontainer
    {
      float: left;
      padding: 20px;
      background-color: rgb(235, 235, 235);
      height: 50px;
      -webkit-appearance: none;
      appearance: none;
      width: 33%;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin: 0;
    }
    .canvas 
    {
      float: left;
      padding: 0px;
      background-color: rgb(235, 235, 235);
      -webkit-appearance: none;
      appearance: none;
      opacity: 0.8;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin-top: 0px;
      border: 0px solid black;
    }   
    .sliderX
    {
      float: left;
      padding: 0px;
      background-color: rgb(235, 235, 235);
      -webkit-appearance: none;
      appearance: none;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin-left: -40px;
      margin-top: 60px;
      rotate: 90deg;
      width: 100px;
    }
    .sliderY
    {
      float: right;
      padding: 0px;
      background-color: rgb(235, 235, 235);
      -webkit-appearance: none;
      appearance: none;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
      font: inherit;
      margin-top: 0px;
      margin-right: -15px;
      rotate: 0deg;
      width: 100px;
    }
    .grid-container-xy 
    {
      display: grid;
      grid-template-columns: 20px 85px;
      grid-template-rows: 200px;
    }
    .grid-container 
    {
      display: grid;
      grid-template-columns: 50%, 50%;
      grid-template-rows: auto auto;
    }
    </style>
</head>
<body>
	<h1>XYFLYBLE</h1>
	<h2>Auto Mating Flies</h2>
	<button id="connectBleButton">Connect to BLE Device</button>
	<button id="disconnectBleButton">Disconnect BLE Device</button>
	<p>BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
<!--	We will toggle the display of this wrapper when BLE is connected/disconnected-->
	<div id="main_wrapper" style="display: none;"
		<div class="grid-container">
			<div class="container">
			  <div class="statuscontainer">
				<p>Status: <span class="textcontainer" id="main_status"></span></p>
			  </div>
			</div>
			<div></div>
		</div>
		<div class="container">
		  <input type="button" value="Go home" id="go_home_button">
		  <input type="button" value="Set home" id="set_home_button">
		  <input type="button" value="Find home" id="find_home_button">
		</div>
		<div></div>
		<div class="grid-container-xy">
		<div>
		  <input type="range" min="0" max="100" value="0" step="10" class="sliderX" id="sliderX">
		</div>
		<div>
		  <input type="range" min="0" max="100" value="0" step="10" class="sliderY" id="sliderY">
		  <canvas id="canvas_element" width="100" height="100" class="canvas"></canvas>
		  <input type="button" value="Go to target" id="goto_target_button">
		  <p>Target (x, y): <span class="textcontainer" id="rect_pos_text"></span></p>
		</div>
		</div>
		<div>
		<div>
		  <input type="checkbox" name="follow_checkbox" id="follow_checkbox">
		  <label for="follow_checkbox">Follow mode</label>
		</div>
		</div>
		<div class="container">
		<input type="button" value="Run main" id="run_main_button">
		<input type="button" value="Stop main" id="stop_main_button">
		<input type="button" value="Dispense 1 second" id="dispense1s_button">
		<input type="button" value="Dispense infinite" id="dispense_button">
		</div>
		<div class="container">
		<div class="grid-container">
		  <input type="button" value="Up (Y+)" id="jog_up_button">
		  <input type="button" value="Down (Y-)" id="jog_down_button">
		  <input type="button" value="Left (X-)" id="jog_left_button">
		  <input type="button" value="Right (X+)" id="jog_right_button">
		</div>
		<input type="button" value="Stop X Motor" id="stopX_button">
		<input type="button" value="Stop Y Motor" id="stopY_button">
		<input type="button" value="Stop ALL Motors" id="stop_button">
		</div>
		<div class="grid-container">
		<input type="button" value="Microsteps: 1" id="microstep1_button">    
		<input type="button" value="Microsteps: 2" id="microstep2_button">    
		<input type="button" value="Microsteps: 4" id="microstep4_button">
		<input type="button" value="Microsteps: 8" id="microstep8_button">
		<input type="button" value="Microsteps: 16" id="microstep16_button">
		<input type="button" value="Microsteps: 32" id="microstep32_button">
		<input type="range" min="500" max="100000" value="80000" step="500" class="slider" id="sliderSpeed">
		<input type="button" value="Set speed" id="speed_button">
		<p>Speed (steps per second): <span class="textcontainer" id="target_speed_text">4000</span></p>
		</div>
		<div></div>
		<div>
		<input type="checkbox" name ="joystickCheckbox" id="joystick_checkbox">
		<label for="joystickCheckbox">Joystick mode</label>
		<input type="checkbox" name ="debugCheckbox" id="debug_checkbox">
		<label for="debugCheckbox">Debug mode</label>
		<div class="grid-container" style="grid-template-columns: auto auto auto;">
		  <p id="debug_parent" style="visibility: hidden;">Debug: <span class="textcontainer" id="debug_text">???</span></p>
		</div>
		</div>
		<div>
		<h2>Last command: <p><span id="valueContainer">NaN</span></h2>
			  <input type="text" id="cmdInput", name ="cmdInput">
			  <button id="sendCmdButton">Send command</button></p>
		<p>Last reading datetime: <span id="timestamp"></span></p>
		</div>
	</div>
</body>
<script>
	var main_wrapper = document.getElementById("main_wrapper");
  	var main_button = document.getElementById("run_main_button");
	var stop_main_button = document.getElementById("stop_main_button");
	var stop_button = document.getElementById("stop_button");
	var go_home_button = document.getElementById("go_home_button");
	var set_home_button = document.getElementById("set_home_button");
	var find_home_button = document.getElementById("find_home_button");
	var main_status = document.getElementById("main_status");
	var jog_left_button = document.getElementById("jog_left_button");
	var jog_right_button = document.getElementById("jog_right_button");
	var jog_up_button = document.getElementById("jog_up_button");
	var jog_down_button = document.getElementById("jog_down_button");
	var dispense_button = document.getElementById("dispense_button");
	var dispense1s_button = document.getElementById("dispense1s_button");
	var stopX_button = document.getElementById("stopX_button");
	var stopY_button = document.getElementById("stopY_button");
	var full_button = document.getElementById('full_vial_button');
	var empty_button = document.getElementById('empty_vial_button');
	var canvas_element = document.getElementById('canvas_element');
	var microstep1_button = document.getElementById('microstep1_button');
	var microstep2_button = document.getElementById('microstep2_button');
	var microstep4_button = document.getElementById('microstep4_button');
	var microstep8_button = document.getElementById('microstep8_button');
	var microstep16_button = document.getElementById('microstep16_button');
	var microstep32_button = document.getElementById('microstep32_button');
	var sliderSpeed = document.getElementById('sliderSpeed');
	var speed_button = document.getElementById('speed_button');
	var target_speed_text = document.getElementById('target_speed_text');
	var canvas = document.createElement('canvas');
	var live_view = document.getElementById('live_view');
	var ctx = canvas_element.getContext("2d");
	var targetX = 0;
	var targetY = 0;
	var rect_pos_text = document.getElementById('rect_pos_text');
	var sliderX = document.getElementById('sliderX');
	var sliderY = document.getElementById('sliderY');
	var targetSize = 10;
	var command = "";
	var follow_checkbox = document.getElementById('follow_checkbox');
	var joystick_checkbox = document.getElementById('joystick_checkbox');
	var debug_checkbox = document.getElementById('debug_checkbox');
	var debug_text = document.getElementById('debug_text');
	var debug_parent = document.getElementById('debug_parent');
	var xcal_button = document.getElementById('xcal_button');
	var mouseDown = 0;

	const connectButton = document.getElementById('connectBleButton');
	const disconnectButton = document.getElementById('disconnectBleButton');
	const sendCmdButton = document.getElementById('sendCmdButton');
	const cmdInput = document.getElementById('cmdInput');
	const retrievedValue = document.getElementById('valueContainer');
	const latestValueSent = document.getElementById('valueSent');
	const bleStateContainer = document.getElementById('bleState');
	const timestampContainer = document.getElementById('timestamp');

	var deviceName ='XYFLYBLE';
	var bleService = 'd6d3eb5e-ddaf-492c-af4e-19323edf8fad';
	var pCharacteristic = 'c57884e4-fae7-4370-81cf-6b4919b28042';

	var bleServer;
	var bleServiceFound;
	var pCharacteristicFound;

	document.body.onmousedown = function() 
	{ 
		mouseDown = 1;
	}
	document.body.ontouchstart = function()
	{
	  mouseDown = 1;
	}
	document.body.onmouseup = function() 
	{
		mouseDown = 0;
	}
	//Update the canvas when the mouse is hovered over to render the red rectangle over the mouse position
	canvas_element.onmousemove = function(evt){updateCanvas(evt);}
	//Get the mouse position relative to the canvas
	function getMousePos(evt) 
	{
		var rect = canvas_element.getBoundingClientRect();
		return {x: evt.clientX - rect.left, y: evt.clientY - rect.top};
	}
	//Erase all canvas elements and draw all the elements to the canvas
	function updateCanvas(evt)
	{
	  //Clear the canvas then 
	  //  Draw the green target rectangle
	  ctx.clearRect(0, 0, canvas_element.getAttribute("width"), canvas_element.getAttribute("height"));
	  //Draw the red rectangle under the cursor
	  var mousePos = getMousePos(evt);
	  ctx.fillStyle = "green";
	  ctx.fillRect (targetY-2, targetX-2, targetSize, targetSize);
	  //Update the text under the canvas with the current target positions
	  rect_pos_text.innerHTML = targetX + ", " + targetY;
	  if(follow_checkbox.checked)
		{
		  //need to implement a timer here
		  goto_target_button.click();
		}
	}
	//Update the targetX and targetY variables with the position of the mouse cursor on click
	canvas_element.onclick = function(evt) 
	{
	  var mousePos = getMousePos(evt);
	  targetX = Math.round(mousePos.y);
	  targetY = Math.round(mousePos.x);
	  sliderX.value = targetX;
	  sliderY.value = targetY;
	  updateCanvas(evt);
	}
	canvas_element.onmousemove = function(evt)
	{
	  if(mouseDown)
	  {
		var mousePos = getMousePos(evt);
		targetX = Math.round(mousePos.y);
		targetY = Math.round(mousePos.x);
		sliderX.value = targetX;
		sliderY.value = targetY;
		updateCanvas(evt);
	  }
	}
	//Update the position of the target based on the slider values
	sliderX.oninput = function(evt)
	{
	  targetX = sliderX.value;
	  updateCanvas(evt);
	}
	sliderY.oninput = function(evt)
	{
	  //Invert the y values since the slider is rotated 180 degrees
	  targetY = sliderY.value;
	  updateCanvas(evt);
	}
	sliderSpeed.oninput = function(evt)
	{
	  target_speed_text.innerHTML = sliderSpeed.value;
	}
	follow_checkbox.onchange = function(evt)
	{
	  if(follow_checkbox.checked)
	  {
		main_status.innerHTML = "Following enabled";
		writeOnCharacteristic("follow1");
	  }else
	  {
		main_status.innerHTML = "Following disaled";
		writeOnCharacteristic("follow0");
	  }
	}
	joystick_checkbox.onchange = function(evt)
	{
	  if(joystick_checkbox.checked)
	  {
		main_status.innerHTML = "Joystick enabled";
		writeOnCharacteristic("joy1");
	  }else
	  {
		main_status.innerHTML = "Joystick disabled";
		writeOnCharacteristic("joy0");
	  }
	}
	debug_checkbox.onchange = function(evt)
	{
	  if(debug_checkbox.checked)
	  {
		main_status.innerHTML = "Debugging enabled";
		debug_parent.style.visibility = "visible";
		writeOnCharacteristic("debug1");
	  }else
	  {
		main_status.innerHTML = "Debugging disabled";
		debug_parent.style.visibility = "hidden";
		writeOnCharacteristic("debug0");
	  }
	  if(!!window.EventSource)
	  {
		var source = new EventSource('/events');
		source.addEventListener('open', function(e) {
			console.log("Events Connected");
		}, false);
		source.addEventListener('error', function(e) {
			if (e.target.readyState != EventSource.OPEN) {
			  console.log("Events Disconnected");
			}
		}, false);
		source.addEventListener('debug', function(e) 
		{
			console.log("debug message", e.data);
			debug_text.innerHTML = e.data;
		}, false);
	  }
	}
	//The buttons below send a specific command to the ESP32 using the xhr.open() and xhr.send() functions
	speed_button.onclick = function()
	{
	  command = "speed" + sliderSpeed.value;
	  main_status.innerHTML = "Sending command: " + command;
	  writeOnCharacteristic(command);
	}
	goto_target_button.onclick = function()
	{
	  command = "goX" + targetX + "goY" + targetY;
	  main_status.innerHTML = "Sending command: " + command;
	  writeOnCharacteristic(command);
	}
	main_button.onclick = function()
	{
	  main_status.innerHTML = "Fill all vials";
	  writeOnCharacteristic("fillall");
	}
	stop_main_button.onclick = function()
	{
	  main_status.innerHTML = "Stop all filling operations";
	  writeOnCharacteristic("stopfillall");
	}
	jog_left_button.onclick = function()
	{
	  main_status.innerHTML = "Jog right (-X)";
	  writeOnCharacteristic("prevX");
	}
	jog_right_button.onclick = function()
	{
	  main_status.innerHTML = "Jog left (+X)";
	  writeOnCharacteristic("nextX");
	}
	stopX_button.onclick = function()
	{
	  main_status.innerHTML = "Stopping X stepper";
	  writeOnCharacteristic("stopX");
	}
	jog_up_button.onclick = function()
	{
	  main_status.innerHTML = "Jog up (+Y)";
	   writeOnCharacteristic("nextY");
	}
	jog_down_button.onclick = function()
	{
	  main_status.innerHTML = "Jog down (-Y)";
	   writeOnCharacteristic("prevY");
	}
	stopY_button.onclick = function()
	{
	  main_status.innerHTML = "Stopping Y stepper";
	  writeOnCharacteristic("stopY");
	}
	stop_button.onclick = function()
	{
	  main_status.innerHTML = "Stopping the steppers";
	   writeOnCharacteristic("stop");
	}
	go_home_button.onclick = function()
	{
	  main_status.innerHTML = "Homing the steppers";
	   writeOnCharacteristic("gohome");
	}
	set_home_button.onclick = function()
	{
	  main_status.innerHTML = "Setting home for both steppers";
	   writeOnCharacteristic("sethome");
	}
	find_home_button.onclick = function(evt)
	{
	  main_status.innerHTML = "Finding home for both steppers";
	   writeOnCharacteristic("findhome");
	}
	dispense_button.onclick = function(evt)
	{
	  main_status.innerHTML = "Dispensing -no stop-";
	   writeOnCharacteristic("dispense");
	}
	dispense1s_button.onclick = function(evt)
	{
	  main_status.innerHTML = "Dispensing -1 second-";
	  writeOnCharacteristic("pump");
	}
	microstep1_button.onclick = function()
	{
	  main_status.innerHTML = "Microstep set to: 1";
	  writeOnCharacteristic("microstep1");
	}
	microstep2_button.onclick = function()
	{
	  main_status.innerHTML = "Microstep set to: 2";
	  writeOnCharacteristic("microstep2");
	}
	microstep4_button.onclick = function()
	{
	  main_status.innerHTML = "Microstep set to: 4";
	  writeOnCharacteristic("microstep4");
	}
	microstep8_button.onclick = function()
	{
	  main_status.innerHTML = "Microstep set to: 8";
	  writeOnCharacteristic("microstep8");
	}
	microstep16_button.onclick = function()
	{
	  main_status.innerHTML = "Microstep set to: 16";
	  writeOnCharacteristic("microstep16");
	}
	microstep32_button.onclick = function()
	{
	  main_status.innerHTML = "Microstep set to: 32";
	  writeOnCharacteristic("microstep32");
	}

	// Connect Button (search for BLE Devices only if BLE is available)
	connectButton.addEventListener('click', (event) => {
		if (isWebBluetoothEnabled()){
			connectToDevice();
		}
	});

	// Disconnect Button
	disconnectButton.addEventListener('click', disconnectDevice);

	//Send command button takes the text from the input field and udpates the pCharacterstic with that value
	sendCmdButton.addEventListener('click', (event) => {if (isWebBluetoothEnabled())
		{
			retrievedValue.innerHTML = cmdInput.value;
			writeOnCharacteristic(cmdInput.value);
		}});

	// Check if BLE is available in your Browser
	function isWebBluetoothEnabled() 
	{
		if (!navigator.bluetooth) 
		{
			console.log("Web Bluetooth API is not available in this browser!");
			bleStateContainer.innerHTML = "Web Bluetooth API is not available in this browser!";
			return false
		}
		console.log('Web Bluetooth API supported in this browser.');
		return true
	}

	// Connect to BLE Device and Enable Notifications
	function connectToDevice()
	{
		console.log('Initializing Bluetooth...');
		navigator.bluetooth.requestDevice({
			acceptAllDevices:true,
			optionalServices:['d6d3eb5e-ddaf-492c-af4e-19323edf8fad','c57884e4-fae7-4370-81cf-6b4919b28042']
		})
		.then(device => {
			console.log('Device Selected:', device.name);
			bleStateContainer.innerHTML = 'Connected to device ' + device.name;
			bleStateContainer.style.color = "#24af37";
			device.addEventListener('gattservicedisconnected', onDisconnected);
			return device.gatt.connect();
		})
		.then(gattServer =>{
			bleServer = gattServer;
			console.log("Connected to GATT Server");
			return bleServer.getPrimaryService(bleService);
		})
		.then(service => {
			bleServiceFound = service;
			console.log("Service discovered:", service.uuid);
			
			return service.getCharacteristic(pCharacteristic);
		})
		.then(characteristic => {
			console.log("Characteristic discovered:", characteristic.uuid);
			pCharacteristicFound = characteristic;
			characteristic.addEventListener('characteristicvaluechanged', handleCharacteristicChange);
			characteristic.startNotifications();
			console.log("Notifications Started.");
			main_wrapper.style.display = "inline-block";
			console.log("Controls Revealed.");
			return characteristic.readValue();
		})
		.then(value => {
			console.log("Read value: ", value);
			const decodedValue = new TextDecoder().decode(value);
			console.log("Decoded value: ", decodedValue);
			retrievedValue.innerHTML = decodedValue;
		})
		.catch(error => {
			console.log('Error: ', error);
		})
	}

	function onDisconnected(event)
	{
		console.log('Device Disconnected:', event.target.device.name);
		bleStateContainer.innerHTML = "Device disconnected";
		bleStateContainer.style.color = "#d13a30";
		connectToDevice();
	}

	function handleCharacteristicChange(event)
	{
		const newValueReceived = new TextDecoder().decode(event.target.value);
		console.log("Characteristic value changed: ", newValueReceived);
		retrievedValue.innerHTML = newValueReceived;
		timestampContainer.innerHTML = getDateTime();
	}

	function writeOnCharacteristic(value)
	{
		if (bleServer && bleServer.connected) 
		{
			bleServiceFound.getCharacteristic(pCharacteristic)
			.then(characteristic => 
			{
				console.log("Found the command characteristic: ", characteristic.uuid);
				const data = new TextEncoder().encode([value]);
				return pCharacteristicFound.writeValue(data);
			})
			.then(() => 
			{
				// latestValueSent.innerHTML = value;
				console.log("Value written to pCharacteristic:", value);
			})
			.catch(error => 
			{
				console.error("Error writing to the  pCharacteristic: ", error);
			});
		} else 
		{
			console.error ("Bluetooth is not connected. Cannot write to characteristic.")
			window.alert("Bluetooth is not connected. Cannot write to characteristic. \n Connect to BLE first!")
			main_wrapper.style.display = "none";
			bleStateContainer.innerHTML = "Device Disconnected";
			bleStateContainer.style.color = "#d13a30";
		}
	}

	function disconnectDevice() 
	{
		console.log("Disconnect Device.");
		main_wrapper.style.display = "none";
		if (bleServer && bleServer.connected) 
		{
			if (pCharacteristicFound) 
			{
				pCharacteristicFound.stopNotifications()
					.then(() => 
					{
						console.log("Notifications Stopped");
						return bleServer.disconnect();
					})
					.then(() => 
					{
						console.log("Device Disconnected");
						bleStateContainer.innerHTML = "Device Disconnected";
						bleStateContainer.style.color = "#d13a30";
					

					})
					.catch(error => 
					{
						console.log("An error occurred:", error);
					});
			} else 
			{
				console.log("No characteristic found to disconnect.");
			}
		} else 
		{
			// Throw an error if Bluetooth is not connected
			console.error("Bluetooth is not connected.");
			window.alert("Bluetooth is not connected.")
		}
	}

	function getDateTime() 
	{
		var currentdate = new Date();
		var day = ("00" + currentdate.getDate()).slice(-2); // Convert day to string and slice
		var month = ("00" + (currentdate.getMonth() + 1)).slice(-2);
		var year = currentdate.getFullYear();
		var hours = ("00" + currentdate.getHours()).slice(-2);
		var minutes = ("00" + currentdate.getMinutes()).slice(-2);
		var seconds = ("00" + currentdate.getSeconds()).slice(-2);
		var datetime = day + "/" + month + "/" + year + " at " + hours + ":" + minutes + ":" + seconds;
		return datetime;
	}


</script>
